# SPDX-License-Identifier: Apache-2.0

[tool.poetry]
name = "kungfu"
version = "0.0.0"
description = "Kungfu Core Library"
license = "Apache-2.0"
authors = ["Kungfu Trader <info@kungfu.link>"]
homepage = "https://www.kungfu-trader.com"
repository = "https://github.com/kungfu-trader/kungfu.git"
packages = [
    { include = "kungfu", from = "src/python" },
]

[tool.poetry.dependencies]
# v4 现代化：Python 3.13(统一 Mac/Linux，= pykungfu 构建 Python)。
python = ">=3.13, <3.14"

#### Compiler #############################################
black = "~24.10.0"
nuitka = "~2.5.0"
pdm = "~2.21.0"
pdm-pep517 = "~1.1.0"
poetry-core = "~1.9.0"
scons = "~4.8.0"
tomli-w = "~1.0.0"
tomlkit = "~0.13.0"

#### Console ##############################################
click = "~8.1.7"
psutil = "~6.1.0"
tabulate = "~0.9.0"
wcmatch = "~10.0.0"

#### Numeric ##############################################
numpy = "~2.1.0"
pandas = "~2.2.0"
scipy = "~1.14.0"
statsmodels = "~0.14.4"
openpyxl = "~3.1.5"

#### Dependencies #########################################
# 传递/工具类依赖放宽，让 poetry 在 3.13 下自解析兼容版本(避免与 pdm/poetry 等工具的版本要求冲突)。
certifi = "*"
chardet = "*"
charset-normalizer = "*"
importlib-metadata = "*"
msgpack = "*"
filelock = "*"
ordered-set = "*"
packaging = "*"
platformdirs = "*"
pluggy = "*"
pytest = "~8.3.0"
railroad-diagrams = "*"
shellingham = "*"
zipp = "*"
authing = "~5.1.0"
urllib3 = "~2.2.0"
websockets = "~13.1.0"
boto3 = "~1.35.0"
keyring = "~25.5.0"
zstandard = "~0.23.0"

#### Sync Pipfile #########################################
setuptools = "~75.6.0"
virtualenv = "~20.28.0"
wheel = "~0.45.0"
plotly = "^6.8.0"

[tool.poetry.group.dev.dependencies]
# conan 由系统 pipx 提供(2.x)，不再经 poetry 装 conan1。
pyinstaller = "~6.11.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# v4：默认走国内 PyPI 镜像(aliyun)加速依赖解析/下载，避免占用办公室出海链路。
# 可按环境覆盖；prebuilt/发布阶段再评估。
[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"
