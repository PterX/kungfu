# SPDX-License-Identifier: Apache-2.0

[tool.poetry]
name = "kungfu"
version = "0.0.0"
description = "Kungfu Core Library"
license = "Apache-2.0"
authors = ["Kungfu Trader <info@kungfu.link>"]
homepage = "https://www.kungfu-trader.com"
repository = "https://github.com/kungfu-trader/kungfu.git"
packages = [
    { include = "kungfu", from = "src/python" },
]

[tool.poetry.dependencies]
# v4 现代化：Python 3.13(统一 Mac/Linux，= pykungfu 构建 Python)。
python = ">=3.13, <3.14"

#### Compiler #############################################
black = "~24.10.0"
nuitka = "~2.5.0"
pdm = "~2.21.0"
pdm-pep517 = "~1.1.0"
poetry-core = "~1.9.0"
scons = "~4.8.0"
tomli-w = "~1.0.0"
tomlkit = "~0.13.0"

#### Console ##############################################
click = "~8.1.7"
psutil = "~6.1.0"
tabulate = "~0.9.0"
wcmatch = "~10.0.0"

#### Numeric ##############################################
numpy = "~2.1.0"
pandas = "~2.2.0"
scipy = "~1.14.0"
statsmodels = "~0.14.4"
openpyxl = "~3.1.5"

#### Dependencies #########################################
certifi = "~2023.7.22"
chardet = "~5.1.0"
charset-normalizer = "~3.3.2"
importlib-metadata = "~8.5.0"
msgpack = "~1.1.0"
filelock = "~3.16.0"
ordered-set = "~4.1.0"
packaging = "~24.2"
platformdirs = "~4.3.0"
pluggy = "~1.5.0"
pytest = "~8.3.0"
railroad-diagrams = "~3.1.0"
shellingham = "~1.5.4"
zipp = "~3.21.0"
authing = "~5.1.0"
urllib3 = "~2.2.0"
websockets = "~13.1.0"
boto3 = "~1.35.0"
keyring = "~25.5.0"
zstandard = "~0.23.0"

#### Sync Pipfile #########################################
setuptools = "~75.6.0"
virtualenv = "~20.28.0"
wheel = "~0.45.0"

[tool.poetry.group.dev.dependencies]
# conan 由系统 pipx 提供(2.x)，不再经 poetry 装 conan1。
pyinstaller = "~6.11.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
