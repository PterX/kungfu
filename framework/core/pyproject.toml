# SPDX-License-Identifier: Apache-2.0

# ============================================================================
# uv 迁移(goal 2026-06-26-kungfu-buildchain-modernization S1，阶段 A+B 完成)
# 单一真相源 = [project](PEP 621) + [tool.uv]：uv 接管 env+lock+install；
# wheel 由 setuptools 后端 + src/python/setup.py(读 [project]) 承担(已脱 poetry-core)。
# ============================================================================

[project]
name = "kungfu"
version = "0.0.0"
description = "Kungfu Core Library"
license = { text = "Apache-2.0" }
authors = [{ name = "Kungfu Trader", email = "info@kungfu.link" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    # Compiler
    "black~=24.10.0",
    "nuitka~=4.1.0",
    "pdm~=2.21.0",
    "pdm-pep517~=1.1.0",
    "scons~=4.8.0",
    "tomli-w~=1.0.0",
    "tomlkit~=0.13.0",
    # Console
    "click~=8.1.7",
    "psutil~=6.1.0",
    "tabulate~=0.9.0",
    "wcmatch~=10.0.0",
    # Numeric
    "numpy~=2.1.0",
    "pandas~=2.2.0",
    "scipy~=1.14.0",
    "statsmodels~=0.14.4",
    "openpyxl~=3.1.5",
    # Loose / transitive(放宽，3.13 自解析)
    "certifi",
    "chardet",
    "charset-normalizer",
    "importlib-metadata",
    "msgpack",
    "filelock",
    "ordered-set",
    "packaging",
    "platformdirs",
    "pluggy",
    "pytest~=8.3.0",
    "railroad-diagrams",
    "shellingham",
    "zipp",
    "authing~=5.1.0",
    "urllib3~=2.2.0",
    "websockets~=13.1.0",
    "boto3~=1.35.0",
    "keyring~=25.5.0",
    "zstandard~=0.23.0",
    # was Pipfile [packages] seed
    "setuptools~=75.6.0",
    "virtualenv~=20.28.0",
    "wheel~=0.45.0",
    "pip~=24.3.0",
    "plotly>=6.8.0,<7.0.0",
    # was Pipfile [packages] os-specific（带平台 marker）
    "xattr==1.1.4 ; sys_platform != 'win32'",
    "cffi==1.17.1 ; sys_platform != 'win32'",
    "pycparser==2.22 ; sys_platform != 'win32'",
    "colorama==0.4.6 ; os_name == 'nt'",
    "pywin32-ctypes==0.2.3 ; sys_platform == 'win32'",
    "cryptography==43.0.3 ; sys_platform == 'linux'",
    "jeepney==0.8.0 ; sys_platform == 'linux'",
    "secretstorage==3.3.3 ; sys_platform == 'linux'",
]

[project.urls]
homepage = "https://www.kungfu-trader.com"
repository = "https://github.com/kungfu-trader/kungfu.git"

[dependency-groups]
dev = ["pyinstaller~=6.11.0"]

[tool.uv]
# 钉 uv 自管 standalone CPython(而非系统/发行版 python)：跨机一致,且根治 nuitka 在
# Debian/系统 python(flavor 'Debian Python')下冻结段错误(SIGSEGV);新机由 uv 自动下载对应
# standalone 解释器,freeze 行为可复现。
python-preference = "only-managed"
# pypi index 不在仓内硬编码(开源安全,避免内网/镜像耦合)：走用户全局 ~/.config/uv/uv.toml 的
# index-url,或环境变量 UV_DEFAULT_INDEX(可由 kungfu-code 的 cache-proxy 配置统一提供);
# 二者皆未配置则用官方 PyPI。需要 CN 镜像/局域网 devpi 时在用户侧配置,不污染本仓。

# S1 阶段 B：脱 poetry-core，单一真相源收敛到 [project]/[tool.uv]。
# wheel build 由 setuptools 后端 + src/python/setup.py（读 [project]）承担。
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
